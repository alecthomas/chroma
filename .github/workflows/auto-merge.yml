name: Auto-merge
on:
  # pull_request_target is required for a write token on fork PRs. PR code must
  # never be checked out or executed here; files are only read via the API.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
permissions:
  actions: write
  contents: write
  pull-requests: write
concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  auto-merge:
    name: Auto-merge lexer and style changes
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Without a ref, pull_request_target checks out the base branch, so this runs trusted code.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Approve CI and enable auto-merge for eligible changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: go run ./internal/automerge
