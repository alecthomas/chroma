name: Auto-merge
on:
  # pull_request_target is required for a write token on fork PRs. PR code must
  # never be checked out or executed here; files are only read via the API.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
permissions:
  actions: write
  contents: write
  pull-requests: write
concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  auto-merge:
    name: Auto-merge lexer and style changes
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Approve CI and enable auto-merge for eligible changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        shell: python3 -I {0}
        run: |
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          import urllib.parse
          import xml.etree.ElementTree as ET

          REPO = os.environ["REPO"]
          PR = os.environ["PR"]
          HEAD_SHA = os.environ["HEAD_SHA"]
          BOT = "github-actions[bot]"
          LEXER = re.compile(r"^lexers/embedded/[^/]+\.xml$")
          STYLE = re.compile(r"^styles/[^/]+\.xml$")
          TESTDATA = re.compile(r"^lexers/testdata/.+\.(actual|expected)$")
          GO_TESTS_MARKER = "<!-- auto-merge:go-tests -->"


          def gh(*args, check=True):
              return subprocess.run(["gh", *args], check=check, capture_output=True, text=True).stdout


          def content(path, ref):
              quoted = urllib.parse.quote(path)
              return gh("api", "-H", "Accept: application/vnd.github.raw", f"repos/{REPO}/contents/{quoted}?ref={ref}")


          def lexer_config(xml):
              # Mirrors chroma's fastUnmarshalConfig: first "config" at any depth, matched by local name.
              config = next((e for e in ET.fromstring(xml).iter() if e.tag.rpartition("}")[2] == "config"), None)
              if config is None:
                  return None
              return ET.canonicalize(ET.tostring(config, encoding="unicode"))


          def file_reason(status, path, merge_base):
              if TESTDATA.match(path):
                  if status not in ("added", "modified"):
                      return f"{path} is {status}"
              elif LEXER.match(path) or STYLE.match(path):
                  if status != "modified":
                      return f"{path} is {status}"
                  before, after = content(path, merge_base), content(path, HEAD_SHA)
                  if LEXER.match(path) and lexer_config(before) != lexer_config(after):
                      return f"{path} changes lexer config"
                  if STYLE.match(path) and ET.fromstring(before).attrib != ET.fromstring(after).attrib:
                      return f"{path} changes style attributes"
              else:
                  return f"{path} is not a lexer, style or testdata file"
              return None


          def comment_on_go_tests(paths):
              comments = gh("api", "--paginate", f"repos/{REPO}/issues/{PR}/comments", "--jq", f'.[] | select(.user.login == "{BOT}") | .body')
              if GO_TESTS_MARKER in comments:
                  return
              listed = "\n".join(f"- `{path}`" for path in paths)
              body = (
                  f"{GO_TESTS_MARKER}\n"
                  "Lexer and style changes should be tested with `lexers/testdata` files, not Go tests. "
                  "Add a `.actual` input, generate its `.expected` output with "
                  "`RECORD=true go test ./lexers`, and remove:\n\n"
                  f"{listed}"
              )
              gh("pr", "comment", PR, "--repo", REPO, "--body", body)


          def ineligible_reasons():
              compare = json.loads(gh("api", f"repos/{REPO}/compare/{os.environ['BASE_SHA']}...{HEAD_SHA}"))
              merge_base = compare["merge_base_commit"]["sha"]
              files = [json.loads(line) for line in gh("api", "--paginate", f"repos/{REPO}/pulls/{PR}/files", "--jq", ".[] | {status, filename}").splitlines()]
              # The files API silently truncates at 3000 entries.
              if len(files) != int(os.environ["CHANGED_FILES"]):
                  return [f"only {len(files)} of {os.environ['CHANGED_FILES']} changed files could be listed"]
              go_tests, reasons = [], []
              for file in files:
                  status, path = file["status"], file["filename"]
                  if status == "added" and path.endswith("_test.go"):
                      go_tests.append(path)
                  elif reason := file_reason(status, path, merge_base):
                      reasons.append(reason)
              if go_tests and not reasons:
                  comment_on_go_tests(go_tests)
                  reasons = [f"{path} adds a Go test" for path in go_tests]
              return reasons


          def disable_auto_merge():
              enabled_by = gh("api", f"repos/{REPO}/pulls/{PR}", "--jq", ".auto_merge.enabled_by.login // empty", check=False).strip()
              if enabled_by == BOT:
                  gh("pr", "merge", PR, "--repo", REPO, "--disable-auto", check=False)


          def approve_ci_runs():
              # CI runs for this push are created alongside this one, so may not be listed yet.
              for _ in range(12):
                  runs = gh("api", f"repos/{REPO}/actions/runs?event=pull_request&head_sha={HEAD_SHA}", "--jq", ".workflow_runs[] | [.id, .status] | @tsv")
                  if runs:
                      break
                  time.sleep(5)
              for line in runs.splitlines():
                  run_id, status = line.split("\t")
                  if status == "action_required":
                      print(f"Approving CI run {run_id}")
                      gh("api", "-X", "POST", f"repos/{REPO}/actions/runs/{run_id}/approve")


          try:
              reasons = ineligible_reasons()
          except Exception:
              disable_auto_merge()
              raise

          if reasons:
              print(f"Not eligible: {'; '.join(reasons)}")
              disable_auto_merge()
              sys.exit(0)

          print("Eligible: approving CI and enabling auto-merge")
          approve_ci_runs()
          gh("pr", "merge", PR, "--repo", REPO, "--auto", "--squash", "--match-head-commit", HEAD_SHA)
